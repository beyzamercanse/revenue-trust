version: 2
models:
  - name: fct_orders
    description: One paid order. Amounts are integer pence, excluding tax and shipping in this simulation.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: paid_cents
        data_tests: [not_null]
  - name: fct_refunds
    description: One accepted refund; prevalidated by the Python landing pipeline.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
  - name: mart_daily_revenue
    description: One event date and acquisition channel; refunds use posting date.
    columns:
      - name: day
        data_tests: [not_null]
  - name: mart_reconciliation
    description: One date with modeled revenue compared against ledger postings.
    columns:
      - name: day
        data_tests: [unique, not_null]
